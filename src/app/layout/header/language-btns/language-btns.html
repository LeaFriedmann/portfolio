<div>
  <button class="lang-btn" [class.lang-btn--active]="language() === 'en'" (click)="language.set('en')">
    <div class="line"></div>
    EN
    <div class="line" [class.line--visible]="language() === 'de'"></div>
  </button>
  <button class="lang-btn" [class.lang-btn--active]="language() === 'de'" (click)="language.set('de')">
    <div class="line"></div>
    DE
    <div class="line" [class.line--visible]="language() === 'en'"></div>
  </button>
</div>
