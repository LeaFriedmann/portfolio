<section class="hero" id="hero">
  <div class="section-settings content-wrapper">
    <section>
      <h1 [class.small-h1]="language.langSetting() == 'de'">
        @if (language.langSetting() == 'en') {
          Frontend Developer
        }
        @if (language.langSetting() == 'de') {
          Frontend Entwicklerin
        }
      </h1>
      <div class="heading">
        <div class="line"></div>
        <p>Lea Friedmann</p>
      </div>
    </section>
    <section class="bottom-part">
      <div class="mail-arrow">
        <mail-link></mail-link>
        <arrow-down></arrow-down>
      </div>
    </section>
  </div>
</section>
