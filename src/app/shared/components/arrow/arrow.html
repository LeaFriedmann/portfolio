<section class="arrow-section" [class.arrow-section--mirrored]="arrowMirrored()">
  <div
    #arrow
    class="arrow-animation"
    [class.animate]="animate()"
    [class.arrow-animation--mirrored]="arrowMirrored()"
  >
    <img class="frame frame__1" src="./assets/images/arrow-default.png" alt="arrow" />
    <img class="frame frame__2" src="./assets/images/arrow-animate.png" alt="arrow" />
    <img class="frame frame__3" src="./assets/images/arrow-after.png" alt="arrow" />
  </div>
</section>
